<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile Card</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div class="profile-card">
      <div class="profile-card__banner"></div>
      <div class="profile-card__avatar">JS</div>
      <div class="profile-card__body">
        <h2 class="profile-card__name">Jane Smith</h2>
        <p class="profile-card__role">Frontend Developer</p>
        <p class="profile-card__bio">Passionate about building clean, accessible user interfaces with vanilla HTML, CSS, and JavaScript.</p>
        <div class="profile-card__stats">
          <div class="profile-card__stat">
            <span class="profile-card__stat-value">42</span>
            <span class="profile-card__stat-label">Projects</span>
          </div>
          <div class="profile-card__stat">
            <span class="profile-card__stat-value">1.2k</span>
            <span class="profile-card__stat-label">Followers</span>
          </div>
          <div class="profile-card__stat">
            <span class="profile-card__stat-value">300</span>
            <span class="profile-card__stat-label">Following</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
