<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pagination</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <nav class="pagination" aria-label="Pagination">
      <a class="pagination__btn pagination__btn--prev" href="#" aria-label="Previous page">← Previous</a>

      <div class="pagination__numbers">
        <a class="pagination__number active" href="#" data-page="1">1</a>
        <a class="pagination__number" href="#" data-page="2">2</a>
        <a class="pagination__number" href="#" data-page="3">3</a>
        <span class="pagination__ellipsis">...</span>
        <a class="pagination__number" href="#" data-page="8">8</a>
        <a class="pagination__number" href="#" data-page="9">9</a>
        <a class="pagination__number" href="#" data-page="10">10</a>
      </div>

      <a class="pagination__btn pagination__btn--next" href="#" aria-label="Next page">Next →</a>
    </nav>
    <p class="pagination-info">Currently on page <strong id="currentPage">1</strong></p>
  </div>
  <script src="script.js"></script>
</body>
</html>
