<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Progress Bar</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div class="progress-demo">
      <label>File upload: 35%</label>
      <div class="progress" role="progressbar" aria-valuenow="35" aria-valuemin="0" aria-valuemax="100">
        <div class="progress__bar" style="width: 35%"></div>
      </div>
    </div>
    <div class="progress-demo">
      <label>Download: 72%</label>
      <div class="progress" role="progressbar" aria-valuenow="72" aria-valuemin="0" aria-valuemax="100">
        <div class="progress__bar" style="width: 72%"></div>
      </div>
    </div>
    <div class="progress-demo">
      <label>Completed: 100%</label>
      <div class="progress" role="progressbar" aria-valuenow="100" aria-valuemin="0" aria-valuemax="100">
        <div class="progress__bar" style="width: 100%"></div>
      </div>
    </div>
  </div>
</body>
</html>
