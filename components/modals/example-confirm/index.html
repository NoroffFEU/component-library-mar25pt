<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Confirm Dialog</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <button class="open-modal-btn" id="openModal">Delete Account</button>
  </div>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal" role="dialog" aria-labelledby="modalTitle" aria-modal="true">
      <h2 class="modal__title" id="modalTitle">Are you sure?</h2>
      <p class="modal__message">This action cannot be undone. Your account and all associated data will be permanently deleted.</p>
      <div class="modal__actions">
        <button class="modal__btn modal__btn--cancel" id="cancelBtn">Cancel</button>
        <button class="modal__btn modal__btn--confirm" id="confirmBtn">Yes, delete</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
