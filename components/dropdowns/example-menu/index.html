<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menu Dropdown</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div class="dropdown">
      <button class="dropdown__trigger">
        Options
        <span class="dropdown__arrow">&#9662;</span>
      </button>
      <ul class="dropdown__menu">
        <li><a class="dropdown__item" href="#">Edit Profile</a></li>
        <li><a class="dropdown__item" href="#">Settings</a></li>
        <li><a class="dropdown__item" href="#">Notifications</a></li>
        <li class="dropdown__divider"></li>
        <li><a class="dropdown__item dropdown__item--danger" href="#">Log Out</a></li>
      </ul>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
