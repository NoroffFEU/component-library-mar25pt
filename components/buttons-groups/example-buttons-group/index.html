<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Button Group</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div class="button-group">
      <button class="button-group__btn active">List</button>
      <button class="button-group__btn">Grid</button>
      <button class="button-group__btn">Map</button>
    </div>

    <div class="button-group button-group--secondary">
      <button class="button-group__btn active">Day</button>
      <button class="button-group__btn">Week</button>
      <button class="button-group__btn">Month</button>
      <button class="button-group__btn">Year</button>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
