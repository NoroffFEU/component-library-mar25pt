<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Component Library</title>
  <link rel="stylesheet" href="styles/main.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" crossorigin="anonymous" />
</head>
<body>
  <div class="layout">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar__header">
        <a href="#" class="sidebar__logo" aria-label="Noroff UI">
          <img src="images/noroff-logo.png" alt="Noroff logo" width="60" height="60" />
          <span>Noroff <i>UI</i></span>
        </a>
        <button class="sidebar__close" id="sidebarClose" aria-label="Close menu">&times;</button>
      </div>
      <nav class="sidebar__nav" id="sidebarNav">
        <!-- Menu items generated by JS -->
      </nav>
    </aside>

    <!-- Main content -->
    <main class="main">
      <header class="main__header">
        <button class="hamburger" id="hamburger" aria-label="Open menu">
          <span></span>
          <span></span>
          <span></span>
        </button>
        <h2 class="main__title" id="mainTitle">Select a component type</h2>
      </header>
      <div class="gallery" id="gallery">
        <div class="gallery__empty">
          <p>Pick a component type from the menu to browse the library.</p>
        </div>
      </div>
    </main>
  </div>

  <script src="components/components.js"></script>
  <script src="scripts/main.js"></script>
</body>
</html>
